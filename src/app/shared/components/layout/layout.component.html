<div class="layout-container" [class.sidebar-mobile-open]="isSidebarOpen()">
  <!-- Backdrop for Mobile/Tablet Sidebar Drawer -->
  <div class="sidebar-backdrop" (click)="closeSidebar()" *ngIf="isSidebarOpen()"></div>

  <!-- Sidebar Navigation -->
  <aside class="sidebar">
    <div class="brand-section cursor-pointer" routerLink="/">
      <h1 class="brand-title">
        <span class="brand-logo-dot"></span>
        MedConsult V2
      </h1>
      <button class="mobile-close-btn" (click)="closeSidebar()" aria-label="Close menu">&times;</button>
    </div>

    <nav class="menu-section">
      <a 
        *ngFor="let item of menuItems()" 
        [routerLink]="item.route" 
        routerLinkActive="active" 
        class="menu-item"
      >
        <span class="menu-icon">
          <svg *ngIf="item.icon === 'dashboard'" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="sidebar-icon-svg"><rect width="7" height="9" x="3" y="3" rx="1"></rect><rect width="7" height="5" x="14" y="3" rx="1"></rect><rect width="7" height="9" x="14" y="12" rx="1"></rect><rect width="7" height="5" x="3" y="16" rx="1"></rect></svg>
          <svg *ngIf="item.icon === 'doctor'" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="sidebar-icon-svg"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          <svg *ngIf="item.icon === 'clinic'" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="sidebar-icon-svg"><path d="M4 22V4a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v18"></path><path d="M16 22H8"></path><path d="M12 5v4"></path><path d="M10 7h4"></path><path d="M12 13v8"></path></svg>
          <svg *ngIf="item.icon === 'book' || item.icon === 'appointments'" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="sidebar-icon-svg"><path d="M8 2v4"></path><path d="M16 2v4"></path><rect width="18" height="18" x="3" y="4" rx="2"></rect><path d="M3 10h18"></path></svg>
          <svg *ngIf="item.icon === 'consultations'" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="sidebar-icon-svg"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
          <svg *ngIf="item.icon === 'records'" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="sidebar-icon-svg"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"></path><path d="M14 2v4a2 2 0 0 0 2 2h4"></path><path d="M10 9H8"></path><path d="M16 13H8"></path><path d="M16 17H8"></path></svg>
          <svg *ngIf="item.icon === 'health'" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="sidebar-icon-svg"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg>
          <svg *ngIf="item.icon === 'profile'" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="sidebar-icon-svg"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="10" r="3"></circle><path d="M7 20.662V19a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v1.662"></path></svg>
          <svg *ngIf="item.icon === 'settings'" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="sidebar-icon-svg"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.1a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></svg>
        </span>
        <span>{{ item.label | translate }}</span>
      </a>

      <!-- Quick Public Portal Link -->
      <a routerLink="/" class="menu-item portal-link">
        <span class="menu-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="sidebar-icon-svg"><circle cx="12" cy="12" r="10"></circle><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"></path><path d="M2 12h20"></path></svg>
        </span>
        <span>{{ 'Public Portal Home' | translate }}</span>
      </a>
    </nav>

    <div class="sidebar-footer d-flex flex-col gap-2">
      <!-- Language Switcher in Sidebar -->
      <button class="btn btn-outline w-100 lang-toggle-btn d-flex align-center justify-center gap-2" (click)="languageService.toggleLanguage()">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"></path><path d="M2 12h20"></path></svg>
        {{ languageService.currentLang() === 'en' ? 'العربية' : 'English' }}
      </button>
      <button class="btn btn-outline w-100 logout-btn d-flex align-center justify-center gap-2" (click)="handleLogout()">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" x2="9" y1="12" y2="12"></line></svg>
        {{ 'Logout' | translate }}
      </button>
    </div>
  </aside>

  <!-- Main View Area -->
  <div class="main-area">
    <!-- Top Header Bar -->
    <header class="header">
      <div class="d-flex align-center gap-3 flex-wrap">
        <!-- Mobile Toggle Button -->
        <button class="hamburger-btn" (click)="toggleSidebar()" aria-label="Toggle navigation menu">
          <span></span>
          <span></span>
          <span></span>
        </button>

        <div class="page-title m-0">
          {{ 'Dashboard Title' | translate }}
        </div>
        <a routerLink="/" class="btn btn-sm btn-outline-primary py-1 px-3 fs-xs rounded-pill portal-pill-btn d-inline-flex align-center gap-1">
          <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"></path><path d="M2 12h20"></path></svg>
          {{ 'View Public Portal' | translate }}
        </a>

        <!-- Quick Language Toggle in Header -->
        <button class="btn btn-sm btn-outline-secondary py-1 px-3 fs-xs rounded-pill lang-header-btn d-inline-flex align-center gap-1" (click)="languageService.toggleLanguage()">
          <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"></path><path d="M2 12h20"></path></svg>
          {{ languageService.currentLang() === 'en' ? 'العربية' : 'English' }}
        </button>
      </div>

      <div class="user-profile" *ngIf="authService.currentUser() as user">
        <div class="user-avatar">
          <img *ngIf="user.avatarUrl" [src]="user.avatarUrl | apiUrl" alt="Avatar" (error)="user.avatarUrl = ''">
          <span *ngIf="!user.avatarUrl">{{ userInitials() }}</span>
        </div>
        <div class="user-details">
          <span class="user-name">{{ user.fullName }}</span>
          <span class="user-role-badge">{{ user.role.replace('_', ' ') }}</span>
        </div>
        <button class="btn btn-sm text-danger border-0 bg-transparent ms-2 cursor-pointer logout-icon-btn d-inline-flex align-center justify-center" (click)="handleLogout()" [title]="'Logout' | translate">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" x2="9" y1="12" y2="12"></line></svg>
        </button>
      </div>
    </header>

    <!-- Nested Content Area -->
    <main class="content-viewport">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
